name: Security Audit

on:
  pull_request:
    branches: [main]
    paths: ['Cargo.lock', 'deny.toml', '.cargo/audit.toml', '.github/workflows/security.yml']
  schedule:
    - cron: '0 8 * * 3' # Every Wednesday at 8:00 UTC
  workflow_dispatch:

# Cancel superseded PR runs; scheduled and manual runs always complete.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  BRANCH: ${{ github.ref_name }}
  COMMIT_SHA: ${{ github.sha }}
  ACTOR: ${{ github.actor }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The two ignore lists drift silently: cargo-audit treats `unmaintained` as a
      # non-fatal warning, so a missing id here never turns the build red on its own.
      - name: Advisory ignore lists are in sync
        run: |
          deny=$(grep -oE '^[[:space:]]*"RUSTSEC-[0-9]{4}-[0-9]{4}"' deny.toml | tr -d ' "' | paste -sd, -)
          workflow=$(sed -n 's/^[[:space:]]*ignore:[[:space:]]*//p' .github/workflows/security.yml)
          if [ "$deny" != "$workflow" ]; then
            echo "::error::deny.toml and security.yml advisory ignore lists diverged"
            echo "  deny.toml: $deny"
            echo "  security.yml: $workflow"
            exit 1
          fi
          echo "Ignore lists match: $deny"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # MUST be a verbatim mirror of `[advisories].ignore` in deny.toml, same IDs in the
          # same order, so the two can be diffed by eye. Both tools read the same RustSec
          # database, but cargo-audit reports `unmaintained` as a non-fatal warning while
          # deny.toml sets `unmaintained = "all"`, so a missing ID here degrades silently
          # into annotation noise rather than a failed build. Advisories for crates that sit
          # in Cargo.lock without being reachable in the build graph belong in
          # .cargo/audit.toml instead, since cargo-deny's graph never sees them.
          ignore: RUSTSEC-2024-0384,RUSTSEC-2024-0436,RUSTSEC-2026-0173,RUSTSEC-2026-0192,RUSTSEC-2026-0206,RUSTSEC-2025-0141,RUSTSEC-2025-0134,RUSTSEC-2026-0194,RUSTSEC-2026-0195

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Run cargo-deny directly instead of EmbarkStudios/cargo-deny-action@v2:
      # the action injects `--log-level`/`--all-features` in a position the bundled
      # cargo-deny no longer accepts, breaking with "unrecognized subcommand 'warn'".
      # Global flags must precede the `check` subcommand in cargo-deny >= 0.18.
      - name: Cargo deny
        run: cargo deny --all-features check

      - name: Telegram notification - Success
        if: success()
        run: |
          COMMIT_MSG=$(git log --format=%s -1 | tr '`' "'" | head -c 80)

          MESSAGE="✅ *Fulgur Security Audit - Passed*

          No security vulnerabilities or license issues found

          *Branch:* \`${BRANCH}\`
          *Commit:* \`${COMMIT_SHA:0:7}\` - ${COMMIT_MSG}
          *Author:* ${ACTOR}

          [View Run](${RUN_URL})"

          jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown", disable_web_page_preview: true}' |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" -d @-

      - name: Telegram notification - Failure
        if: failure()
        run: |
          COMMIT_MSG=$(git log --format=%s -1 | tr '`' "'" | head -c 80)

          MESSAGE="❌ *Fulgur Security Audit - Failed*

          Security vulnerabilities or license issues detected

          *Branch:* \`${BRANCH}\`
          *Commit:* \`${COMMIT_SHA:0:7}\` - ${COMMIT_MSG}
          *Author:* ${ACTOR}

          [View Run](${RUN_URL})"

          jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown", disable_web_page_preview: true}' |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" -d @-
