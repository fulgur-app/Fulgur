name: Safety Audit

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

# First-party unsafe code is guarded by the `unsafe_code` lint in Cargo.toml,
# which clippy enforces on every OS. Fulgur's own unsafe code is Windows-only,
# so this Linux job reports unsafe usage across the dependency tree instead.
# The counts are informational: the job fails only when the audit itself breaks.
jobs:
  geiger:
    name: Unsafe Code Audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `.cargo/config.toml` links with mold on x86_64 Linux.
      - name: Install Linux dependencies
        run: |
          # Free pre-installed tool directories that the build does not use.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y \
            mold \
            libdbus-1-dev \
            pkg-config \
            libssl-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-geiger
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger

      - name: Run cargo-geiger
        id: geiger
        run: |
          set -euo pipefail
          cargo geiger --output-format Json > geiger.out

          # The report is a single JSON line; keep it apart from any other stdout output.
          grep '^{"packages"' geiger.out | tail -n 1 > geiger.json || {
            echo "::error::cargo geiger did not produce a JSON report"
            exit 1
          }

          DEPENDENCIES='[.packages[] | select(.package.id.name != "Fulgur")]'
          SCANNED_CRATES=$(jq "$DEPENDENCIES | length" geiger.json)
          if [ "$SCANNED_CRATES" -eq 0 ]; then
            echo "::error::cargo geiger scanned no dependency"
            exit 1
          fi
          UNSAFE_EXPRS=$(jq "$DEPENDENCIES | map(.unsafety.used.exprs.unsafe_) | add" geiger.json)
          UNSAFE_CRATES=$(jq "$DEPENDENCIES | map(select(.unsafety.used.exprs.unsafe_ > 0)) | length" geiger.json)

          echo "Unsafe expressions used, per crate:"
          jq -r "$DEPENDENCIES | map(select(.unsafety.used.exprs.unsafe_ > 0))[]
            | \"\(.unsafety.used.exprs.unsafe_)\t\(.package.id.name) \(.package.id.version)\"" geiger.json |
            sort -rn

          {
            echo "unsafe_exprs=$UNSAFE_EXPRS"
            echo "unsafe_crates=$UNSAFE_CRATES"
            echo "scanned_crates=$SCANNED_CRATES"
          } >> "$GITHUB_OUTPUT"

      - name: Telegram notification
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          UNSAFE_EXPRS: ${{ steps.geiger.outputs.unsafe_exprs }}
          UNSAFE_CRATES: ${{ steps.geiger.outputs.unsafe_crates }}
          SCANNED_CRATES: ${{ steps.geiger.outputs.scanned_crates }}
        run: |
          if [ -n "$UNSAFE_EXPRS" ]; then
            SAFETY_LINE="Unsafe expressions in dependencies: *${UNSAFE_EXPRS}* (${UNSAFE_CRATES} of ${SCANNED_CRATES} crates)"
          else
            SAFETY_LINE="Unsafe code audit failed"
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            ICON="✅"
            TITLE="Fulgur Safety Audit - Passed"
          else
            ICON="❌"
            TITLE="Fulgur Safety Audit - Failed"
          fi

          MESSAGE="${ICON} *${TITLE}*

          ${SAFETY_LINE}

          [View Run](${RUN_URL})"

          jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown", disable_web_page_preview: true}' |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" -d @-
