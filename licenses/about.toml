# Configuration for cargo-about
# This generates the THIRD-PARTY-LICENSES file for distribution

# Use accepted licenses from common open-source projects
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    "NCSA",
    "CDLA-Permissive-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Unlicense",
    "GPL-2.0-only",
    "bzip2-1.0.6",
]

# openssl-src bundles the entire OpenSSL C source tree (~8000 files), some of which
# carry legacy GPL-1.0/GPL-2.0 notices in Perl scripts and assembly files.
# The crate itself is Apache-2.0 OR MIT; clarify so cargo-about uses only the
# root license files and skips scanning the bundled OpenSSL source.
[openssl-src.clarify]
license = "Apache-2.0 OR MIT"

[[openssl-src.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "a60eea817514531668d7e00765731449fe14d059d3249e0bc93b36de45f759f2"

[[openssl-src.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "378f5840b258e2779c39418f3f2d7b2ba96f1c7917dd6be0713f88305dbda397"

# self_cell: Cargo.toml says Apache-2.0 OR GPL-2.0-only, but the LICENSE-GPLv2
# file is detected as the deprecated GPL-2.0 identifier by cargo-about's scanner.
[self_cell.clarify]
license = "Apache-2.0 OR GPL-2.0-only"

[[self_cell.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4"

[[self_cell.clarify.files]]
path = "LICENSE-GPLv2"
license = "GPL-2.0-only"
checksum = "f9c375a1be4a41f7b70301dd83c91cb89e41567478859b77eef375a52d782505"

# tree-sitter-graphql: has a LICENSE file (MIT) but omits the license field in Cargo.toml.
[tree-sitter-graphql.clarify]
license = "MIT"

[[tree-sitter-graphql.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "5ea7d9ec06cb21ca0a800b69cd954e346bafba94620eb115c4b1fead3f3b30f8"
