# cargo-deny configuration for Fulgur
# https://embarkstudios.github.io/cargo-deny/

# ============================================================================
# Licenses
# ============================================================================
[licenses]
# List of licenses that are allowed
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "bzip2-1.0.6"
]

# Confidence threshold for license detection (0.0 to 1.0)
confidence-threshold = 0.8

# Allow licenses that are exceptions (e.g., font licenses)
exceptions = [
    # Add any specific crate exceptions here if needed
    # { allow = ["SOME-LICENSE"], name = "crate-name" },
]

# ============================================================================
# Security Advisories
# ============================================================================
[advisories]
# The path where advisory databases are stored
db-path = "~/.cargo/advisory-db"

# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]

# Warn on yanked crates
yanked = "warn"

# List of advisory IDs to ignore
ignore = [
    # Unmaintained transitive dependencies from GPUI/gpui-component and age
    # These are outside of Fulgur's control
    "RUSTSEC-2024-0384",  # instant - unmaintained (from gpui-component and gpui-base)
    "RUSTSEC-2024-0436",  # paste - unmaintained (from gpui-component)
    "RUSTSEC-2026-0173",  # proc-macro-error2 - unmaintained (from age via i18n-embed-fl)
    "RUSTSEC-2026-0374",  # basic-toml - unmaintained; no safe upgrade available (from age via i18n-config, compile-time only)
    "RUSTSEC-2026-0192",  # ttf-parser - unmaintained; no safe upgrade available (from gpui via fontdb/cosmic-text/usvg/rustybuzz)
    "RUSTSEC-2026-0206",  # rustybuzz - unmaintained; no safe upgrade available (from gpui-pre via usvg/resvg)
    "RUSTSEC-2025-0134",  # rustls-pemfile - unmaintained; no safe upgrade available (from gpui-pre's Reqwest transport)
    # quick-xml DoS advisories - Linux-only, build/protocol XML parsing of trusted local data, not the untrusted remote XML in the advisory threat model.
    # Cannot upgrade: the fix is quick-xml >= 0.41 and wayland-scanner 0.31 pins ^0.39.
    # quick-xml 0.30 (via xcb <- zed-scap) also sits in Cargo.lock but is never built; the same IDs cover it in cargo-audit.
    "RUSTSEC-2026-0194",  # quick-xml - quadratic runtime on duplicate attribute names (from gpui-pre-linux via wayland-scanner)
    "RUSTSEC-2026-0195",  # quick-xml - unbounded namespace-declaration allocation in NsReader (from gpui-pre-linux via wayland-scanner)
    # zbus 5 split crates - unmaintained since their merge into zbus 6. Linux-only, pulled by
    # zbus 5 through gpui-pre-linux (accesskit_unix, ashpd, notify-rust, oo7) and gpui-base (ashpd).
    # Cleared only when those upstreams move to zbus 6.
    "RUSTSEC-2026-0370",  # zvariant - unmaintained, now zbus 6's `wire` module
    "RUSTSEC-2026-0371",  # zbus_names - unmaintained, now zbus 6's `names` module
    "RUSTSEC-2026-0372",  # zvariant_derive - unmaintained, now zbus 6's derive macros
    # crypto-bigint 0.5 timing side-channels - fixed only in 0.7.6, but age 0.12.1 (latest) pins
    # p256 0.13 -> elliptic-curve 0.13 -> crypto-bigint ^0.5. age only reaches it through its P-256
    # `tag`/`tagpq` recipients; Fulgur uses X25519 exclusively, so the affected code never runs.
    # Cleared when age moves to p256 0.14.
    "RUSTSEC-2026-0387",  # crypto-bigint - non-constant-time arithmetic (from age via p256/elliptic-curve)
]

# Check unmaintained crates in transitive dependencies
# Using "all" would check everything, "none" would skip the check
unmaintained = "all"

# ============================================================================
# Banned Dependencies
# ============================================================================
[bans]
# Warn on multiple versions of the same crate
multiple-versions = "warn"

# Warn on wildcard dependencies (dependencies without a version constraint)
wildcards = "allow"

# List of crates that are allowed to have multiple versions
skip = [
    # Add crates here that are OK to have multiple versions
]

# List of explicitly banned crates
deny = [
    # Add any crates you want to ban here
]

# ============================================================================
# Sources
# ============================================================================
[sources]
# Allow crates from crates.io
unknown-registry = "deny"

# Deny git sources not listed in allow-git
unknown-git = "deny"

# List of allowed git sources
allow-git = [
    "https://github.com/fulgur-app/Fulgur-common.git",
]
